<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormFlow — Forms, like Google Forms</title>
<meta name="description" content="FormFlow is a full-featured Google Forms–style app: build forms, share a link, collect and analyze responses — all in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23673ab7'/%3E%3Cpath d='M15 14h18v4H15zM15 22h18v4H15zM15 30h12v4H15z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
<style>
:root{--theme:#673ab7;--purple:#673ab7;--bg:#f0ebf8;--card:#fff;--text:#1f1f1f;--muted:#5f6368;--border:#dadce0;--radius:12px;--font:'Google Sans',Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text)}
.view{display:none;min-height:100vh}.view.visible{display:block}.hidden,[hidden]{display:none!important}
.topbar,.editor-topbar{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid #e4e2e7;padding:10px 22px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px}.logo-badge{width:40px;height:40px;border-radius:10px;background:linear-gradient(140deg,#7e57c2,#5522a5);display:flex;align-items:center;justify-content:center}
.logo-word{font-size:22px}.logo-word b{color:var(--purple)}
.search-box{flex:1;max-width:720px;height:46px;display:flex;align-items:center;gap:10px;background:#f1f3f4;border-radius:10px;padding:0 14px}
.search-box input{flex:1;border:0;background:transparent;font-size:16px;outline:0}
.avatar-btn{width:38px;height:38px;border:0;border-radius:50%;background:linear-gradient(140deg,#8e24aa,#5e35b1);color:#fff;cursor:pointer}
.dash-hero{padding:22px 48px;background:linear-gradient(180deg,#e9e1f5,#f0ebf8)}
.template-row{display:flex;gap:18px;overflow:auto}.template-card{width:152px;border:0;background:none;cursor:pointer}
.template-thumb{height:112px;border-radius:12px;border:1px solid #ddd8e4;background:#fff;display:flex;align-items:center;justify-content:center}
.blank-plus,.ai-thumb-icon{width:46px;height:46px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center}
.template-card.ai-card .template-thumb{background:linear-gradient(135deg,#8e24aa,#673ab7,#c2185b);border:0;color:#fff}
.dash-body{max-width:1240px;margin:0 auto;padding:22px 48px 56px}
.forms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:20px}
.form-card{background:#fff;border:1px solid #e3e0e8;border-radius:12px;overflow:hidden;cursor:pointer}
.form-thumb{height:118px;padding:14px}
.form-meta{padding:12px 14px}.form-title{margin:0 0 6px;font-size:15px}
.send-btn{display:inline-flex;align-items:center;gap:8px;background:var(--purple);color:#fff;border:0;height:42px;padding:0 22px;border-radius:8px;cursor:pointer;font-size:15px}
.icon-btn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;cursor:pointer;color:#5f6368}
.q-card,.banner-card,.settings-card,.fill-banner,.fill-question,.modal{background:#fff;border:1px solid #e3e0e8;border-radius:12px}
.banner-card{border-top:12px solid var(--theme);padding:22px 28px}
.form-title-input{width:100%;border:0;font-size:31px;outline:0;font-family:inherit}
.questions-list{display:flex;flex-direction:column;gap:14px;max-width:772px;margin:16px auto}
.editor-body{max-width:1080px;margin:26px auto;padding:0 18px}
.modal-overlay{position:fixed;inset:0;z-index:70;background:rgba(23,16,38,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(500px,100%);padding:26px 28px;max-height:90vh;overflow:auto}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:42px;background:#fff;border:1px solid #dadce0;border-radius:8px;cursor:pointer}
.toast{position:fixed;left:24px;bottom:24px;z-index:80;background:#322f35;color:#fff;padding:13px 18px;border-radius:8px}
.fill-wrap{max-width:720px;margin:0 auto;padding:30px 16px 90px}
.local-chip{font-size:12px;color:#4f378b;background:#ede7f8;border-radius:20px;padding:5px 12px}
</style>
</head>
<body>
<div id="app">

  <!-- ============ DASHBOARD VIEW ============ -->
  <section id="view-dashboard" class="view visible" aria-label="Form dashboard">
    <header class="topbar">
      <div class="brand">
        <span class="logo-badge" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="26" height="26"><path d="M15 12h18v4.4H15zM15 21h18v4.4H15zM15 30h12v4.4H15z" fill="#fff"/></svg>
        </span>
        <span class="logo-word">Form<b>Flow</b></span>
      </div>
      <label class="search-box" for="dashSearch">
        <span class="search-icon" id="searchIconSlot"></span>
        <input id="dashSearch" type="text" data-role="dash-search" placeholder="Search forms" autocomplete="off" aria-label="Search forms">
      </label>
      <div class="topbar-right">
        <span class="local-chip" id="dashUserChip" title="All data is stored locally in this browser">Saved locally</span>
        <button class="avatar-btn" id="dashAvatar" data-action="open-profile" title="Account" aria-label="Account"></button>
      </div>
    </header>

    <div class="dash-hero">
      <p class="hero-label">Start a new form</p>
      <div class="template-row" id="templateRow"></div>
    </div>

    <div class="dash-body">
      <div class="forms-header">
        <div class="forms-header-left">
          <h2>Recent forms</h2>
          <span class="forms-count" id="formsCount">0</span>
        </div>
        <div class="forms-header-right">
          <button class="icon-btn toggle active" id="gridModeBtn" data-action="set-grid-mode" data-mode="grid" title="Grid view" aria-label="Grid view"></button>
          <button class="icon-btn toggle" id="listModeBtn" data-action="set-grid-mode" data-mode="list" title="List view" aria-label="List view"></button>
        </div>
      </div>
      <div class="forms-grid" id="formsGrid"></div>
      <footer class="dash-footer">FormFlow — a Google Forms–style builder. Everything is stored in this browser via localStorage.</footer>
    </div>
  </section>

  <!-- ============ EDITOR VIEW ============ -->
  <section id="view-editor" class="view" aria-label="Form editor">
    <header class="editor-topbar">
      <div class="editor-top-row">
        <button class="icon-btn big" data-action="nav-back" title="Back to forms" aria-label="Back to forms"><span class="ic slot-arrow-back"></span></button>
        <span class="editor-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="30" height="30"><rect x="4" y="4" width="40" height="40" rx="8" fill="currentColor" opacity="0.14"/><path d="M14 13h20v3.6H14zM14 20.5h20v3.6H14zM14 28h13v3.6H14z" fill="currentColor"/></svg>
        </span>
        <div class="editor-title-static" id="editorTitleMini">Untitled form</div>
        <div class="editor-spacer"></div>
        <span class="saved-hint" id="savedHint">All changes saved</span>
        <button class="icon-btn" data-action="toggle-theme-pop" title="Customize theme color" aria-label="Customize theme color"><span class="ic slot-palette"></span></button>
        <button class="icon-btn" data-action="preview-form" title="Preview form" aria-label="Preview form"><span class="ic slot-eye"></span></button>
        <button class="send-btn" data-action="open-send"><span class="ic slot-send"></span><span>Send</span></button>
        <button class="avatar-btn sm" id="editorAvatar" data-action="open-profile" title="Account" aria-label="Account"></button>
      </div>
      <nav class="editor-tabs" aria-label="Editor sections">
        <button class="tab-btn active" data-action="set-tab" data-tab="questions">Questions</button>
        <button class="tab-btn" data-action="set-tab" data-tab="responses">Responses&nbsp;<span class="tab-count" id="respTabCount">0</span></button>
        <button class="tab-btn" data-action="set-tab" data-tab="settings">Settings</button>
      </nav>
    </header>

    <div class="editor-body">
      <!-- Questions tab -->
      <div class="q-column" id="tabPanelQuestions">
        <div class="banner-card" id="bannerCard">
          <input class="form-title-input" id="formTitleInput" data-role="banner-title" type="text" placeholder="Untitled form" aria-label="Form title" autocomplete="off" spellcheck="false">
          <input class="form-desc-input" id="formDescInput" data-role="banner-desc" type="text" placeholder="Form description" aria-label="Form description" autocomplete="off">
          <p class="banner-required-note" id="bannerRequiredNote"></p>
        </div>

        <div id="questionsList" class="questions-list"></div>

        <div class="add-row">
          <button class="dashed-add" data-action="add-question">
            <span class="ic slot-plus-large"></span> Add question
          </button>
          <button class="dashed-add ai-dashed" data-action="open-ai-modal" data-mode="add">
            <span class="ic slot-spark"></span> Generate with AI
          </button>
        </div>
      </div>

      <aside class="float-toolbar" id="floatToolbar" aria-label="Question tools">
        <button class="tool-btn" data-action="add-question" title="Add question" aria-label="Add question"><span class="ic slot-plus"></span></button>
        <button class="tool-btn" data-action="open-ai-modal" data-mode="add" title="Generate with AI" aria-label="Generate with AI"><span class="ic slot-spark"></span></button>
      </aside>

      <!-- Responses tab -->
      <div class="q-column wide tab-panel hidden" id="tabPanelResponses"></div>

      <!-- Settings tab -->
      <div class="q-column tab-panel hidden" id="tabPanelSettings"></div>
    </div>
  </section>

  <!-- ============ FILL VIEW ============ -->
  <section id="view-fill" class="view" aria-label="Fill out form">
    <div class="fill-progress-track"><div class="fill-progress-bar" id="fillProgressBar"></div></div>
    <div class="fill-wrap" id="fillColumn"></div>
  </section>

</div><!-- /#app -->

<!-- Popover (more menus / theme picker) -->
<div id="popover" class="popover" hidden role="menu"></div>

<!-- Modal -->
<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal" id="modalCard" role="dialog" aria-modal="true" aria-label="Dialog"></div>
</div>

<!-- Toast -->
<div id="toast" class="toast" hidden role="status"><span id="toastText"></span><button id="toastActionBtn" class="toast-action" hidden></button></div>

<script src="js/store.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
